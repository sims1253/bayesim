on:
  release:
    types: [published]
  workflow_dispatch:

name: release-check

permissions: read-all

jobs:
  release-check:
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    strategy:
      fail-fast: false
      # Full supported matrix: DESCRIPTION requires R >= 4.1, so the oldest
      # supported release line is oldrel-1.
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: macos-latest,   r: 'oldrel-1'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          extra-repositories: https://stan-dev.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # See R-CMD-check.yaml: the remaining WARNING is the documented
          # S7/codoc false positive on metric class constructors.
          error-on: '"error"'
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

  backend-acceptance:
    name: Backend acceptance (reference Linux)
    needs: release-check
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      BAYESIM_RUN_ACCEPTANCE: "true"
      BAYESIM_TEST_TIER: backend

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: https://stan-dev.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Fix CmdStan toolchain
        run: cmdstanr::check_cmdstan_toolchain(fix = TRUE)
        shell: Rscript {0}

      - name: Get CmdStan version
        id: cmdstan-version
        run: |
          version=$(curl -s -H "Authorization: Bearer $GITHUB_PAT" \
            https://api.github.com/repos/stan-dev/cmdstan/releases/latest \
            | jq -r .tag_name)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Failed to resolve latest CmdStan release" >&2
            exit 1
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Cache CmdStan
        uses: actions/cache@v6
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-${{ steps.cmdstan-version.outputs.version }}

      - name: Install CmdStan
        run: |
          if (is.null(cmdstanr::cmdstan_version(error_on_NA = FALSE))) {
            cmdstanr::install_cmdstan(cores = parallel::detectCores())
          }
        shell: Rscript {0}

      - name: Run backend acceptance tier
        run: |
          source("tools/ci/test-tiers.R")
          run_bayesim_test_tier("backend")
        shell: Rscript {0}
