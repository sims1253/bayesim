on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

name: test-nightly

permissions: read-all

jobs:
  backend-acceptance:
    name: Stan backend acceptance
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      BAYESIM_RUN_ACCEPTANCE: "true"
      BAYESIM_TEST_TIER: backend

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Fix CmdStan toolchain
        run: cmdstanr::check_cmdstan_toolchain(fix = TRUE)
        shell: Rscript {0}

      - name: Get CmdStan version
        id: cmdstan-version
        run: |
          version=$(curl -s -H "Authorization: Bearer $GITHUB_PAT" \
            https://api.github.com/repos/stan-dev/cmdstan/releases/latest \
            | jq -r .tag_name)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Failed to resolve latest CmdStan release" >&2
            exit 1
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Cache CmdStan
        uses: actions/cache@v6
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-${{ steps.cmdstan-version.outputs.version }}

      - name: Install CmdStan
        run: |
          if (is.null(cmdstanr::cmdstan_version(error_on_NA = FALSE))) {
            cmdstanr::install_cmdstan(cores = parallel::detectCores())
          }
        shell: Rscript {0}

      - name: Run backend and statistical acceptance tests
        run: |
          source("tools/ci/test-tiers.R")
          run_bayesim_test_tier("backend")
        shell: Rscript {0}
