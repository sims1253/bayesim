on:
  push:
    branches: [main, master]
  pull_request:

name: test-fast

permissions: read-all

jobs:
  test-fast:
    name: test-fast
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The fast tier is Stan-free by construction; run_bayesim_test_tier()
      # restricts testthat to the fast-tier files listed in
      # tools/ci/test-tiers.R and exports this tier marker so backend-gated
      # skips stay skipped.
      BAYESIM_TEST_TIER: fast

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # needs: check installs Depends/Imports/Suggests, which covers ggplot2
      # (Suggests) required by the fast tier's plot assertions.
      - name: Register r-universe repository for pak
        shell: bash
        run: printf 'options(repos = c(getOption("repos"), stan_dev_r_universe_dev = "https://stan-dev.r-universe.dev"))\n' >> "$HOME/.Rprofile"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Run fast tests
        run: |
          Rscript -e '
            source("tools/ci/test-tiers.R")
            run_bayesim_test_tier("fast")
          '
