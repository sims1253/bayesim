# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Coverage runs the core tier (fast + the rest of the analytic suite):
      # the Stan backend suite is out of scope here by design.
      BAYESIM_TEST_TIER: core

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2, stan-dev/cmdstanr
          needs: coverage

      - name: Core-tier coverage
        run: |
          # A daemon subprocess occasionally dies mid-way through writing its
          # covr trace file (observed: two byte-identical files truncated at
          # exactly 224 KiB), and covr's merge_coverage() then fails the whole
          # job with "Error in readRDS(f) : error reading from connection"
          # even though every test passed. Skip unreadable trace files instead
          # of failing on them; the surviving traces (main process + the other
          # daemons) still yield valid coverage. See the tracking issue
          # referenced in the PR discussion for the full forensics.
          covr_ns <- asNamespace("covr")
          tolerant_merge <- function(x) {
            coverage_objs <- Filter(
              Negate(is.null),
              lapply(x, function(f) {
                tryCatch(
                  as.list(suppressWarnings(readRDS(f))),
                  error = function(e) {
                    warning(sprintf("skipping unreadable covr trace file %s", f))
                    NULL
                  }
                )
              })
            )
            covr:::merge_coverage(coverage_objs)
          }
          unlockBinding("merge_coverage.character", covr_ns)
          assign("merge_coverage.character", tolerant_merge, envir = covr_ns)
          lockBinding("merge_coverage.character", covr_ns)
          # S3 dispatch reads the cached method from the methods table, so the
          # table entry must be replaced alongside the namespace binding.
          assign(
            "merge_coverage.character",
            tolerant_merge,
            envir = get(".__S3MethodsTable__.", envir = covr_ns)
          )

          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
