# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Coverage runs the core tier (fast + the rest of the analytic suite):
      # the Stan backend suite is out of scope here by design.
      BAYESIM_TEST_TIER: core

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2, stan-dev/cmdstanr
          needs: coverage

      - name: Core-tier coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Trace forensics (temporary debug, remove before merge)
        if: failure()
        run: |
          echo "=== processes at failure ==="
          ps -eo pid,ppid,stat,lstart,args --sort=start_time || true
          echo "=== trace files at failure ==="
          ls -la --full-time "${RUNNER_TEMP}/package"/covr_trace_* || true
          sleep 45
          echo "=== trace files 45s later ==="
          ls -la --full-time "${RUNNER_TEMP}/package"/covr_trace_* || true
          echo "=== processes 45s later ==="
          ps -eo pid,ppid,stat,lstart,args --sort=start_time || true
        shell: bash

      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
