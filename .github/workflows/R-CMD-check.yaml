# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      BAYESIM_RUN_ACCEPTANCE: true

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # CmdStan toolchain: make sure the compiler setup is usable (installs
      # RTools pieces on Windows if needed), then install CmdStan into
      # ~/.cmdstan unless the cache already restored a build.
      - name: Fix CmdStan toolchain
        run: cmdstanr::check_cmdstan_toolchain(fix = TRUE)
        shell: Rscript {0}

      - name: Get CmdStan version
        id: cmdstan-version
        run: |
          version=$(curl -s -H "Authorization: Bearer $GITHUB_PAT" \
            https://api.github.com/repos/stan-dev/cmdstan/releases/latest \
            | jq -r .tag_name)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Failed to resolve latest CmdStan release" >&2
            exit 1
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Cache CmdStan
        uses: actions/cache@v6
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-${{ steps.cmdstan-version.outputs.version }}

      - name: Install CmdStan
        run: |
          if (is.null(cmdstanr::cmdstan_version(error_on_NA = FALSE))) {
            cmdstanr::install_cmdstan(cores = parallel::detectCores())
          }
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
