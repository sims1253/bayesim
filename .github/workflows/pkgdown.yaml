# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2
        if: github.event.action != 'closed'

      - uses: r-lib/actions/setup-r@v2
        if: github.event.action != 'closed'
        with:
          use-public-rspm: true

      - name: Register r-universe repository for pak
        shell: bash
        run: printf 'options(repos = c(getOption("repos"), stan_dev_r_universe_dev = "https://stan-dev.r-universe.dev"))\n' >> "$HOME/.Rprofile"

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: github.event.action != 'closed'
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site (main branch)
        if: github.event_name != 'pull_request'
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Build site (PR branch)
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          PKGDOWN_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/branch/${{ github.head_ref }}
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

      - name: Deploy PR preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
          target-folder: branch/${{ github.head_ref }}

      - name: Comment PR
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: actions/github-script@v9
        with:
          script: |
            const branch = '${{ github.head_ref }}';
            // S4: interpolate the org/repo like the PKGDOWN_URL env does,
            // instead of hardcoding the package owner.
            const url = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/branch/${branch}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Documentation preview for this PR is available at: ${url}`
            });

      - name: Clean up PR preview
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --single-branch --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-repo
          cd gh-pages-repo
          if [ -d "branch/${{ github.head_ref }}" ]; then
            rm -rf "branch/${{ github.head_ref }}"
            echo "Removed documentation for closed PR: ${{ github.head_ref }}"
            git add .
            git commit -m "Remove documentation for closed PR: ${{ github.head_ref }}" || exit 0
            git push
          else
            echo "No documentation found for PR: ${{ github.head_ref }}"
          fi
