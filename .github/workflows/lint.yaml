# Workflow derived from https://jarl.etiennebacher.com/howto/ci
on:
  push:
    branches: [main, master]
  pull_request:

name: lint

permissions: read-all

jobs:
  jarl-check:
    name: jarl-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run jarl
        uses: etiennebacher/setup-jarl@v0.1.1
