# Package metadata
url: https://sims1253.github.io/bayesim

template:
  bootstrap: 5

development:
  mode: auto

# Navbar configuration
navbar:
  structure:
    left:
      - home
      - reference
      - articles
      - news
    right:
      - github

  components:
    home:
      icon: fas fa-home fa-lg
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
        - text: Get started
          href: articles/getting-started.html
        - text: -------
        - text: Learn
        - text: Design of simulation studies
          href: articles/design-of-simulation-studies.html
        - text: SBC and calibration
          href: articles/sbc-and-calibration.html
        - text: -------
        - text: Backends
        - text: brms studies
          href: articles/brms-studies.html
        - text: Custom fitters
          href: articles/custom-fitters.html
        - text: Custom metrics
          href: articles/custom-metrics.html
        - text: -------
        - text: Operations
        - text: Parallel execution, HPC, and memory
          href: articles/parallel-and-hpc.html
        - text: Reproducibility
          href: articles/reproducibility.html
        - text: Running bayesim with targets
          href: articles/targets.html
    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/sims1253/bayesim

# Reference organization by function purpose
reference:
  - title: Design and run studies
    desc: >
      Configure and execute simulation studies
    contents:
      - simulation_config
      - run_simulation
      - resume_simulation
      - preflight
      - n_replicates_for_target

  - title: Fitters
    desc: >
      Classes and generics for fitting Bayesian models
    contents:
      - Fitter
      - LinearRegressionFitter
      - BrmsFitter
      - CmdStanFitter
      - brms_model
      - model_grid
      - fit_model
      - extract_draws
      - predict_fit
      - predict_epred
      - log_lik_matrix
      - loo_fit
      - fit_diagnostics

  - title: Generators
    desc: >
      Factory constructors for simulation data generators
    contents:
      - fixed_truth_generator
      - prior_predictive_generator
      - ifs_generator
      - prior_draws_generator
      - forward_sim_generator

  - title: Metrics
    desc: >
      Classes and built-in metrics for computing simulation results
    contents:
      - Metric
      - compute_metric
      - posterior_summary_metric
      - coverage_metric
      - rank_metric
      - pos_prob_metric
      - convergence_metric
      - sampler_diagnostics_metric
      - rstar_metric
      - pred_rmse_metric
      - pred_bias_metric
      - pred_mae_metric
      - pred_mse_metric
      - elpd_loo_metric
      - rmse_loo_metric
      - r2_loo_metric
      - elpd_test_metric
      - rmse_test_metric
      - r2_test_metric

  - title: Analysis and reporting
    desc: >
      Summaries, SBC diagnostics, and plotting functions for simulation results
    contents:
      - summarize_simulation
      - performance_measures
      - failed_tasks
      - sbc_ranks
      - plot_rank_hist
      - plot_rank_ecdf
      - plot_recovery
      - plot_coverage
      - plot_metric
      - report
      - read_summary

  - title: Extension support
    desc: >
      Validators, error constructors, and classifiers for extending bayesim
    contents:
      - validate_data_bundle
      - validate_fitter
      - validate_metric
      - bayesim_config_error
      - bayesim_data_error
      - bayesim_fit_error
      - bayesim_metric_error
      - is_bayesim_error
      - is_fatal_error
      - is_recoverable_error

# Articles organization
articles:
  - title: Get started
    contents:
      - getting-started

  - title: Learn
    contents:
      - design-of-simulation-studies
      - sbc-and-calibration

  - title: Backends and extension
    contents:
      - brms-studies
      - custom-fitters
      - custom-metrics

  - title: Operations
    contents:
      - parallel-and-hpc
      - reproducibility
      - targets

  - title: Legacy (superseded; pending removal)
    contents:
      - simulation-study
      - case-studies
      - hpc
      - memory-management
      - bayesfam

# News configuration
news:
  cran_dates: false

# Footer configuration
footer:
  structure:
    left: developed_by
    right: built_with

# Search configuration
search:
  exclude:
    - news/index.html
