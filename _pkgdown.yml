# Package metadata
url: https://sims1253.github.io/bayesim

template:
  bootstrap: 5

# Development mode - release version 1.0.1 is on CRAN
development:
  mode: auto

# Navbar configuration
navbar:
  structure:
    left:
      - home
      - reference
      - articles
      - news
    right:
      - github

  components:
    home:
      icon: fas fa-home fa-lg
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
        - text: Getting Started
          href: articles/getting-started.html
        - text: -------
        - text: Simulation Studies
          href: articles/simulation-study.html
        - text: -------
        - text: Custom Fitters
          href: articles/custom-fitters.html
        - text: -------
        - text: Reproducibility
          href: articles/reproducibility.html
        - text: Memory Management
          href: articles/memory-management.html
        - text: -------
        - text: Case Studies
          href: articles/case-studies.html
    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/sims1253/bayesim

# Reference organization by function purpose
reference:
  - title: Design and run studies
    desc: >
      Configure and execute simulation studies
    contents:
      - simulation_config
      - run_simulation
      - resume_simulation

  - title: Fitters
    desc: >
      Classes and generics for fitting Bayesian models
    contents:
      - Fitter
      - BrmsFitter
      - MockFitter
      - fit_model
      - extract_draws
      - predict_fit
      - predict_epred
      - log_lik_matrix
      - loo_fit
      - fit_diagnostics

  - title: Generators
    desc: >
      Factory constructors for simulation data generators
    contents:
      - fixed_truth_generator
      - prior_predictive_generator
      - ifs_generator

  - title: Metrics
    desc: >
      Classes and built-in metrics for computing simulation results
    contents:
      - Metric
      - compute_metric
      - rmse_metric
      - bias_metric
      - coverage_metric
      - mae_metric
      - mse_metric
      - pos_prob_metric
      - posterior_summary_metric
      - convergence_metric
      - sampler_diagnostics_metric
      - rank_metric
      - rstar_metric
      - elpd_loo_metric
      - rmse_loo_metric
      - r2_loo_metric
      - elpd_test_metric
      - rmse_test_metric
      - r2_test_metric

  - title: Analysis and reporting
    desc: >
      Summaries, SBC diagnostics, and plotting functions for simulation results
    contents:
      - summarize_simulation
      - sbc_ranks
      - plot_rank_hist
      - plot_rank_ecdf
      - plot_recovery
      - plot_coverage
      - plot_metric

  - title: Extension support
    desc: >
      Validators, error constructors, and classifiers for extending bayesim
    contents:
      - validate_data_bundle
      - validate_fitter
      - validate_metric
      - bayesim_config_error
      - bayesim_data_error
      - bayesim_fit_error
      - bayesim_metric_error
      - is_bayesim_error
      - is_fatal_error
      - is_recoverable_error

# Articles organization
articles:
  - title: Getting Started
    contents:
      - getting-started

  - title: Simulation Studies
    contents:
      - simulation-study

  - title: Extending bayesim
    contents:
      - custom-fitters

  - title: Advanced Topics
    contents:
      - reproducibility
      - memory-management

  - title: Case Studies
    contents:
      - case-studies

# News configuration
news:
  cran_dates: true
  releases:
    - text: "Version 1.0.1"
      href: https://cran.r-project.org/package=bayesim

# Footer configuration
footer:
  structure:
    left: developed_by
    right: built_with

# Search configuration
search:
  exclude:
    - news/index.html
